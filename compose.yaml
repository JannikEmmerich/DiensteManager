# Production setup with Docker Compose: PostgreSQL, the app (gunicorn) and Caddy as
# reverse proxy with automatic HTTPS. Configured through the .env file (see
# .env.example); at least DOMAIN, DJANGO_SECRET_KEY and POSTGRES_PASSWORD.

name: dienstemanager

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dienstemanager
      POSTGRES_USER: dienstemanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dienstemanager -d dienstemanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # The released image from the GitHub Container Registry (DIENSTEMANAGER_VERSION in
    # .env, e.g. 0.2.0; default: latest release). "docker compose up -d --build" builds it
    # from the checked-out code instead.
    image: ghcr.io/jannikemmerich/dienstemanager:${DIENSTEMANAGER_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?DOMAIN is missing in .env}
      DATABASE_URL: postgres://dienstemanager:${POSTGRES_PASSWORD}@db:5432/dienstemanager
      CACHE_URL: dbcache://django_cache
      ALLAUTH_TRUSTED_PROXY_COUNT: "1"
      # Emails go out through the worker container.
      EMAIL_QUEUE: ${EMAIL_QUEUE:-True}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    # Sends the emails in the background (queue, retries, daily summaries) and applies
    # the retention periods once a day (see README). Same image as web.
    image: ghcr.io/jannikemmerich/dienstemanager:${DIENSTEMANAGER_VERSION:-latest}
    build: .
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "run_worker", "--heartbeat", "/tmp/worker-alive"]
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?DOMAIN is missing in .env}
      DATABASE_URL: postgres://dienstemanager:${POSTGRES_PASSWORD}@db:5432/dienstemanager
      CACHE_URL: dbcache://django_cache
      EMAIL_QUEUE: ${EMAIL_QUEUE:-True}
      SITE_URL: https://${DOMAIN}
    # Instead of the image's healthcheck (web server): the worker touches this file
    # after every look at the queue.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 300)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
