# Keeps dependencies up to date with weekly pull requests; minor and patch updates of
# each ecosystem are grouped into one pull request.
version: 2
updates:
  # The Python packages: pyproject.toml and the exact versions in uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
