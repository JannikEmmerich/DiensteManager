name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to its own branch (claude/issue-…) or the PR branch
      pull-requests: write # comment on pull requests
      issues: write # comment on issues
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    env:
      # manage.py needs a secret key outside DEBUG (makemessages, compilemessages, ...).
      DJANGO_SECRET_KEY: ci-only-secret-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The same environment as the tests in ci.yml, so that Claude can run them.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install GNU gettext
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gettext

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv export --quiet --locked --group dev --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --requirement "$RUNNER_TEMP/requirements.txt"

      - name: Compile translations
        run: python manage.py compilemessages --ignore=.venv

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Commands Claude may run besides git: tests, linting and the translation and
          # migration commands (see https://code.claude.com/docs/en/cli-reference).
          claude_args: |
            --allowedTools "Bash(python -m pytest:*),Bash(ruff check:*),Bash(ruff format:*),Bash(python manage.py makemessages:*),Bash(python manage.py compilemessages:*),Bash(python manage.py makemigrations:*),Bash(python manage.py check:*),Bash(msgfmt:*)"

