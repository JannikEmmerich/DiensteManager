# Tests every pull request and every push; builds the Docker image and publishes it to
# the GitHub Container Registry (ghcr.io) for pushes to master and for version tags.
# A version tag (v1.2.3) additionally creates the GitHub release. See "Versions,
# releases and updates" in the README.

name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Python, and the one in the Docker image with PostgreSQL.
          - python: "3.12"
            database: sqlite
          - python: "3.14"
            database: postgres
    services:
      postgres:
        # An empty image skips the service for the SQLite run.
        image: ${{ matrix.database == 'postgres' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_USER: dienstemanager
          POSTGRES_PASSWORD: dienstemanager
          POSTGRES_DB: dienstemanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dienstemanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://dienstemanager:dienstemanager@localhost:5432/dienstemanager' || 'sqlite:///ci.sqlite3' }}
      DJANGO_SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v7

      - name: Check the version tag against pyproject.toml and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install GNU gettext
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gettext

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Compile translations
        run: DJANGO_DEBUG=True python manage.py compilemessages --ignore=.venv

      - name: Check for missing migrations
        run: DJANGO_DEBUG=True python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python -m pytest

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        # Registry names must be lower case.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=master
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=DiensteManager
            org.opencontainers.image.description=Staff planning with external units, based on duties from HiOrg-Server
          annotations: |
            org.opencontainers.image.title=DiensteManager
            org.opencontainers.image.description=Staff planning with external units, based on duties from HiOrg-Server

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests only check that the image builds (one platform is enough).
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/release_notes.py "$TAG" > notes.md
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          printf '\n\n**Docker image:** `%s`\n' "$image" >> notes.md
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md $prerelease
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $prerelease
          fi
