{% load i18n %}
<div id="messages"{% if oob %} hx-swap-oob="true"{% endif %}>
    {% for message in messages %}
        <div class="alert alert-{{ message.level_tag|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="{% translate 'Close' %}"></button>
        </div>
    {% endfor %}
</div>
