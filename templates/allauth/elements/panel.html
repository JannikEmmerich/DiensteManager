{% load allauth %}
<section class="card mb-4">
    <div class="card-header fw-semibold">
        {% slot title %}
        {% endslot %}
    </div>
    <div class="card-body">
        {% slot body %}
        {% endslot %}
    </div>
    {% if slots.actions %}
        <div class="card-footer d-flex flex-wrap gap-2">
            {% for action in slots.actions %}{{ action }}{% endfor %}
        </div>
    {% endif %}
</section>
